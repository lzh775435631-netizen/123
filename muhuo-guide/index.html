<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木火 · 人生指南</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#173c32;font:16px/1.7 system-ui}header,nav{background:#173c32;color:white;padding:18px}main{max-width:780px;margin:auto;padding:16px 16px 100px}section{background:white;border-radius:16px;padding:20px;margin:14px 0}h1,h2,h3{margin:0 0 12px}nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:center;gap:8px}button,input,select{font:inherit;padding:10px;border:1px solid #b9c8bc;border-radius:8px}button{background:#e8eee6;color:#173c32;cursor:pointer}nav button{flex:1;max-width:150px;min-width:0;padding:8px 1px;font-size:13px}nav{gap:3px;padding:12px 5px}small{color:#69756e}details{border-top:1px solid #ddd;padding:10px 0}.pill{display:inline-block;padding:8px 15px;border-radius:12px;background:#eee;margin:4px}.row{display:flex;flex-wrap:wrap;gap:10px}.wheelwrap{position:relative;max-width:480px;margin:24px auto 12px;aspect-ratio:1}.wheelcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;border-radius:50%;background:#f4e6c8;color:#173c32;border:3px solid #b88a47;font-weight:bold;box-shadow:0 2px 15px #0004}.wheelpointer{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:2;color:#b88a47;font-size:22px}.wheelresult{font-weight:bold}svg g[role=button]{cursor:pointer}h2{scroll-margin-top:16px}</style><header><small style="color:#bdcfc4">个人传统文化参考</small><h1>木火 · 人生指南</h1></header><main id="app"><section>请选择出生日期建立个人档案。<input type="date" id="birth"><button onclick="save()">保存</button></section></main><nav id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script><script>
const G='甲乙丙丁戊己庚辛壬癸',Z='子丑寅卯辰巳午未申酉戌亥',E='木木火火土土金金水水',B='水土木木土火火土金金土水',els=['木','火','土','金','水'],hidden=['癸','己癸辛','甲丙戊','乙','戊乙癸','丙戊庚','丁己','己丁乙','庚壬戊','辛','戊辛丁','壬甲'],mod=(n,m)=>(n%m+m)%m,daynum=d=>Math.floor(Date.parse(d+'T00:00:00Z')/86400000),pillar=n=>G[mod(n,10)]+Z[mod(n,12)],dp=d=>pillar(daynum(d)+17),local=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date()),app=document.getElementById('app');let date=local(),tab=0,profile={};try{profile=JSON.parse(localStorage.getItem('mh-profile')||'{}')}catch(e){}
const colors={木:['森林绿','青色','东','3、8','木质配饰'],火:['朱砂红','暖橙','南','2、7','暖色配饰'],土:['米黄','棕色','中央','5、10','陶瓷'],金:['白色','银色','西','4、9','金属配饰'],水:['深蓝','黑色','北','1、6','蓝色配饰']};
function save(){let parts=['by','bm','bd'].map(id=>Number(document.getElementById(id).value));let [y,m,d]=parts;if(!parts.every(Number.isInteger)||y<1900||y>2100||m<1||m>12||d<1||d>30){alert('请输入有效农历年月日');return}let found='';try{if(typeof Lunar!=='undefined'){let l=Lunar.fromYmd(y,m,d);if(l.getYear()===y&&l.getMonth()===m&&l.getDay()===d)found=l.getSolar().toYmd()}}catch(e){}if(!found){try{let fmt=new Intl.DateTimeFormat('en-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});for(let t=Date.UTC(y,0,1);t<Date.UTC(y+1,2,1);t+=86400000){let p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));if(Number(p.relatedYear||p.year)===y&&/^\d+$/.test(p.month)&&+p.month===m&&+p.day===d){found=new Date(t).toISOString().slice(0,10);break}}}catch(e){}}if(!found){alert('无法转换该农历日期，请检查日期或使用 Safari 重新打开。原档案未修改。');return}let next={birth:found,lunar:parts.join('-'),hour:+document.getElementById('hour').value};try{localStorage.setItem('mh-profile',JSON.stringify(next));if(localStorage.getItem('mh-profile')!==JSON.stringify(next))throw Error()}catch(e){alert('浏览器禁止本地存储，档案未保存。请使用 Safari 普通窗口。');return}profile=next;render();alert('档案保存成功，公历 '+found+'，命盘已重新计算。')}
function setup(){return '<section><h2>个人档案</h2>请输入农历出生日期（普通月，非闰月；不上传）<br><div class="row"><label>农历年 <input id="by" type="number" inputmode="numeric" placeholder="年" min="1900" max="2100" style="width:110px"></label><label>月 <input id="bm" type="number" inputmode="numeric" placeholder="月" min="1" max="12" style="width:75px"></label><label>日 <input id="bd" type="number" inputmode="numeric" placeholder="日" min="1" max="30" style="width:75px"></label></div><select id="hour">'+Array.from(Z,(z,i)=>'<option value="'+i+'" '+(i===(profile.hour??7)?'selected':'')+'>'+z+'时</option>').join('')+'</select><button onclick="save()">保存档案</button></section>'}
function natal(){if(!profile.birth)return [];if(typeof Solar!=="undefined"){let [y,m,d]=profile.birth.split("-").map(Number);let x=Solar.fromYmdHms(y,m,d,profile.hour===0?0:profile.hour*2-1,30,0).getLunar().getEightChar();return [x.getYear(),x.getMonth(),x.getDay(),x.getTime()]}let [y,m,d]=profile.birth.split('-').map(Number);let yy=y-(m<2||m===2&&d<4?1:0),ys=mod(yy-4,10),ms=mod(m-2-(d<6?1:0),12),p=dp(profile.birth),hs=mod(G.indexOf(p[0])*2+profile.hour,10);return [pillar(yy-4),G[mod(ys*2+2+ms,10)]+Z[mod(ms+2,12)],p,G[hs]+Z[profile.hour]]}
function el(c){return G.includes(c)?E[G.indexOf(c)]:B[Z.indexOf(c)]}
function rel(a,b){let x=els.indexOf(a),y=els.indexOf(b);return ['同类','我生','我克','克我','生我'][mod(y-x,5)]}
function analysis(d){let p=dp(d),n=natal(),r=[];if(n.length){for(let i=0;i<4;i++){let a=Z.indexOf(p[1]),b=Z.indexOf(n[i][1]),s=mod(a-b,12);if(s===6)r.push('流日'+p[1]+'与'+['年','月','日','时'][i]+'支'+n[i][1]+'相冲');if(mod(a+b,12)===1)r.push('流日与'+n[i][1]+'六合');if(mod(a+b,12)===7&&a!==b)r.push('流日与'+n[i][1]+'相害')}}let e=n.length?el(n[2][0]):'水',f=el(p[0]),target=els[mod(els.indexOf(e)+1,5)];if(f===target)target=els[mod(els.indexOf(e)+2,5)];return {p,r,e,f,target}}
function card(title,body){return '<section><h2>'+title+'</h2>'+body+'</section>'}
const topics={'穿搭':'颜色属于传统象征，按肤色与场合搭配。','首饰':'木质属木、金属属金；宝石归类因流派而异。','城市':'方位取决于出发地，气候不等于命理属性；就业与成本优先。','职业':'教育常归木，传播常归火，金融常归金；实际技能和收入更重要。','家居':'植物取木、照明取火，注意通风采光和消防。','饮食':'五色食物是传统文化分类，不应因此限制饮水或营养。','兴趣':'阅读、园艺常取木象，摄影、舞蹈常取火象。','日用品':'按颜色和材质分别归类，不必更换正常用品。'};
function plain(a){let k=rel(a.e,a.f),map={'同类':['同类力量','传统上象征自主、伙伴与竞争。','把合作分工和自己的目标写清楚，避免重复投入。'],'我生':['输出力量','传统上象征表达、技能、作品与创造。','选一个可以完成的作品或任务，先交付再优化。'],'我克':['财星关系','传统上象征资源、交易与成果，不等于今天一定赚钱。','核算成本、检查订单和现金流，不凭命理下注。'],'克我':['官杀关系','传统上象征责任、规则和外部要求，不意味着必有压力。','先处理截止日期、合同和重要承诺。'],'生我':['印星关系','传统上象征学习、知识和支持。','复盘已有经验，找可靠资料解决一个实际问题。']};return map[k]}
function deep(a){let t=plain(a),c=colors[a.target],n=natal();return card('今日报告 · 大白话','<h3>'+t[0]+'</h3><p>'+t[1]+'</p><p><b>今天怎么做：</b>'+t[2]+'</p><details><summary>为什么这样解释？</summary>日主'+a.e+'，流日'+a.p+'，日干'+a.f+'，五行关系为'+rel(a.e,a.f)+'。这是传统十神的五行层级解释，未区分阴阳正偏，也不等于旺衰判断。</details>')+card('穿搭与生活应用','<p>主色：'+c[0]+'；点缀：'+c[1]+'。可以选择一件主色上衣，配中性色裤子与鞋，或只在配饰中使用。</p><p>方位 '+c[2]+'、数字 '+c[3]+'、物品 '+c[4]+' 都是传统象征，不需要改变正常出行或购买用品。</p><details><summary>依据与局限</summary>当前采用日主所生、所克元素的简化主题规则，尚未核定个人喜用神，因此不能解释为真正的幸运预测。</details>')+card('事业 · 财富 · 人际','<p><b>事业：</b>'+t[2]+'</p><p><b>财富：</b>区分收入、成本和可用余额；不要用流日决定投资或借贷。</p><p><b>人际：</b>明确自己的需求和承诺，遇到分歧先核实现实原因。</p>')+card('命局互动 · 看懂术语',a.r.length?a.r.map(x=>'<p>'+x+'<br><small>'+ (x.includes('相冲')?'冲是地支相对的传统关系，常被解释为变化或矛盾，不代表必然发生事故。':x.includes('六合')?'六合是传统配对关系，常被解释为连接或协调，不代表一定有好事。':'害是传统地支关系的一种，象征潜在摩擦，不代表现实中有人害你。')+'</small></p>').join(''):'本规则未发现已覆盖的冲合害；这不代表当天一定平顺。')+card('与昨天、明天对比',[-1,0,1].map(i=>{let d=new Date((daynum(date)+i)*86400000).toISOString().slice(0,10),v=analysis(d);return '<p>'+['昨天','今天','明天'][i+1]+' '+v.p+' · '+plain(v)[0]+'<br><small>'+plain(v)[1]+'</small></p>'}).join(''))}
function ten(d,c){let same=G.indexOf(d)%2===G.indexOf(c)%2;return {'同类':same?'比肩':'劫财','我生':same?'食神':'伤官','我克':same?'偏财':'正财','克我':same?'七杀':'正官','生我':same?'偏印':'正印'}[rel(el(d),el(c))]}
function life(n){let w=Object.fromEntries(els.map(e=>[e,0]));n.forEach((p,i)=>{w[el(p[0])]+=1;Array.from(hidden[Z.indexOf(p[1])]).forEach((x,j)=>w[el(x)]+=(i===1?2:1)*[1,.5,.3][j])});let e=el(n[2][0]),total=Object.values(w).reduce((a,b)=>a+b,0),support=w[e]+w[els[mod(els.indexOf(e)-1,5)]];return card('命局结构与十神',els.map(x=>'<p>'+x+' <progress max="'+total+'" value="'+w[x]+'"></progress> '+w[x].toFixed(1)+'</p>').join('')+'<p>生扶权重 '+Math.round(support/total*100)+'%。大白话：这是观察命局结构的简化指标，不是实际运势或公认旺衰尺度。</p><details><summary>依据</summary>透干1分，藏干主次1、0.5、0.3，月支加倍。不能单凭此确定喜用神。</details>'+n.map((p,i)=>'<p>'+['年','月','日','时'][i]+'柱 '+p+'：'+(i===2?'日主':ten(n[2][0],p[0]))+'；藏干 '+Array.from(hidden[Z.indexOf(p[1])],x=>x+' '+ten(n[2][0],x)).join('、')+'</p>').join(''))+card('人生说明书','<h3>事业与赚钱</h3><p>食伤象征输出，财象征资源与成果。现实中可以通过作品、技能与客户需求验证赚钱方向。先测试低成本项目，记录净收益，再决定是否扩大。</p><h3>城市与生活</h3><p>以岗位、租金、交通、合法居留条件和人脉比较城市。五行方位仅作为文化偏好。</p><h3>个人成长</h3><p>每周记录完成事项、反馈和下一步，用真实结果检验方向。</p>')}
function years(n){let y=Number(date.slice(0,4));return card('未来十年 · 流年索引',Array.from({length:10},(_,i)=>{let p=pillar(y+i-4),a={e:el(n[2][0]),f:el(p[0])};return '<details><summary>'+(y+i)+'年 '+p+' · '+ten(n[2][0],p[0])+'</summary><p>'+plain(a)[1]+'</p><p>行动参考：'+plain(a)[2]+'</p></details>'}).join('')+'<small>仅年干关系，未叠加大运；传统上以立春换年。</small>')}
function strength(n){let e=el(n[2][0]),parent=els[mod(els.indexOf(e)-1,5)],support=x=>[e,parent].includes(el(x)),month=hidden[Z.indexOf(n[1][1])][0],roots=n.map((p,i)=>({p,i,h:hidden[Z.indexOf(p[1])]})).filter(x=>Array.from(x.h).some(c=>el(c)===e)),w=0,total=0;n.forEach((p,i)=>{if(i!==2){total++;if(support(p[0]))w++}Array.from(hidden[Z.indexOf(p[1])]).forEach((c,j)=>{let v=[1,.5,.25][j]*(i===1?3:1);total+=v;if(support(c))w+=v})});let ratio=w/total,kind=ratio>.67?'身强倾向':ratio>.53?'身偏强倾向':ratio>=.45?'相对平衡':ratio>=.32?'身偏弱倾向':'身弱倾向';return {e,parent,month,roots,ratio,kind,picks:ratio>.53?[els[mod(els.indexOf(e)+1,5)],els[mod(els.indexOf(e)+2,5)]]:ratio<.45?[parent,e]:els.slice()}}
function strengthCard(n){let a=strength(n);return card('身强身弱 · '+a.kind,'<p>日主为'+n[2][0]+'，不是身体强弱，也不是能力评价。</p><p><b>得令：</b>月支'+n[1][1]+'主气'+a.month+'，与日主关系为'+rel(a.e,el(a.month))+'。</p><p><b>得地：</b>'+ (a.roots.map(x=>x.p+'藏'+Array.from(x.h).filter(c=>el(c)===a.e).join('')).join('、')||'未见同五行藏干根气')+'。</p><p><b>得势：</b>同类及生扶元素为'+a.e+'、'+a.parent+'；其余属于克泄耗方向。</p><p><b>扶抑候选：</b>'+a.picks.join('、')+'。仅供传统分析比较，并非已确定喜用神。</p><details><summary>计算规则与未解决问题</summary>月令权重3，其他地支1，藏干主次1/0.5/0.25，去掉日干自身。分类阈值为自定义启发式，不是传统公认标准。调候、通关、合化及从格尚需人工复核。</details>')}
const traits={'比肩':['自主与协作','观察自己是否愿意独立承担任务；合作前明确责任。'],'劫财':['竞争与边界','记录合作中的资源分配，避免冲动承诺。'],'食神':['持续输出','尝试将技能整理成稳定可重复的作品流程。'],'伤官':['创新与质疑','把新想法做成小实验，用反馈代替争论。'],'偏财':['机会与资源','比较机会的成本、回报和最坏结果。'],'正财':['稳定与积累','用预算和可交付成果检验计划。'],'七杀':['挑战与约束','将压力拆分为可控制的小任务。'],'正官':['责任与秩序','建立明确期限与验收标准。'],'偏印':['探索与反思','限制资料收集时间，完成一个应用实验。'],'正印':['学习与支持','主动寻求反馈，整理可复用知识。']};
function personality(n){let counts={};n.forEach((p,i)=>{let cs=(i===2?'':p[0])+hidden[Z.indexOf(p[1])];Array.from(cs,c=>{let t=ten(n[2][0],c);counts[t]=(counts[t]||0)+1})});return card('人格探索 · 十神象征',Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<details><summary>'+k+' · '+traits[k][0]+'（出现'+v+'次）</summary>'+traits[k][1]+'<p>自我验证：过去一个月是否有具体事例支持这种描述？也记录反例。</p></details>').join('')+'<p>这些是传统象征而非真实人格测量。</p>')+card('人格档案 · 实际自评','<label>MBTI（自填）<input id="mbti" maxlength="12"></label><button onclick="saveMBTI()">保存</button><p>开放性、尽责性、外向性、宜人性、情绪稳定性：分别记录实际行为，不由八字推定。</p>')}
function dailyExtra(n){let a=analysis(date),t=ten(n[2][0],a.p[0]),v=strength(n);return card('每日深度分析 · '+t,'<p><b>主题：</b>'+traits[t][0]+'。'+traits[t][1]+'</p><p><b>命局关联：</b>流日天干'+a.p[0]+'属'+a.f+'，与'+n[2][0]+'为'+t+'，'+(v.picks.includes(a.f)?'落在扶抑候选范围':'不在当前扶抑候选范围')+'，不代表吉凶。</p><p><b>情绪：</b>记录当前压力来源及可控制事项。</p><p><b>感情：</b>先确认对方的真实需要，不以干支猜测对方想法。</p><p><b>行动：</b>'+plain(a)[2]+'</p><textarea id="journal" style="width:100%" placeholder="记录实际发生的事"></textarea><button onclick="localStorage.setItem(\'mh-journal-\'+date,document.getElementById(\'journal\').value)">保存复盘</button>')}
function practical(n){let v=strength(n),data={木:'森林绿针织衫、米白裤、棕鞋；木质手串；阅读、园艺；教育、设计、出版',火:'酒红上衣、深灰裤、白鞋；暖色灯光；摄影、舞蹈；传媒、餐饮、内容制作',土:'卡其外套、米白裤、棕鞋；陶瓷、亚麻；徒步；物流、建筑、运营',金:'白衬衫、灰裤、黑鞋；银饰、不锈钢；器械训练；制造、财务、工程',水:'藏蓝外套、浅灰裤、白鞋；深蓝手机壳；游泳、旅行；运输、贸易、信息服务'};return card('个人生活与行业对照',v.picks.map(e=>'<h3>'+e+' · '+colors[e][0]+'</h3><p>'+data[e]+'</p><p>依据：'+rel(v.e,e)+'，属于当前简化扶抑候选；行业和物品仅为民俗分类，不是收入或健康预测。</p>').join('')+'<p>城市比较：广州（供应链与贸易）、深圳（科技与跨境）、杭州（电商与内容）、上海（金融与专业服务）、洛杉矶（传媒与物流）。以合法居留、岗位、成本和语言能力为先。</p>')}

const actionMap={
'比肩':['独立推进','挑一件自己能决定的任务，先完成初稿','合作时先谈分工，不必事事亲力亲为','检查重复采购与重复投入'],

function wheelHome(n){let focus=n.length?({比肩:5,劫财:5,食神:8,伤官:8,偏财:4,正财:4,七杀:3,正官:3,偏印:7,正印:7}[ten(n[2][0],analysis(date).p[0])]):0;let segments=wheelItems.map((label,i)=>{let angle=i*30-90,rad=angle*Math.PI/180,x=160+119*Math.cos(rad),y=160+119*Math.sin(rad),a=(angle-15)*Math.PI/180,b=(angle+15)*Math.PI/180;return '<g role="button" tabindex="0" aria-label="'+label+'" onclick="wheelGo('+i+')" onkeydown="if(event.key===\'Enter\')wheelGo('+i+')"><path d="M160 160 L'+(160+151*Math.cos(a))+' '+(160+151*Math.sin(a))+' A151 151 0 0 1 '+(160+151*Math.cos(b))+' '+(160+151*Math.sin(b))+' Z" fill="'+(i===focus?'#b88a47':i%2?'#245346':'#173c32')+'" stroke="#d6bd83" stroke-width="1.2"/><text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle" fill="#fff6e5" font-size="11">'+label+'</text></g>'}).join('');return card('每日人生轮盘','<p>点击任意区域直接查看；也可以随机抽取一个探索主题。</p><div class="wheelwrap"><div class="wheelpointer">▼</div><svg id="wheelDisk" viewBox="0 0 320 320" style="width:100%;transition:transform 1.2s cubic-bezier(.15,.75,.15,1)">'+segments+'</svg><button class="wheelcenter" onclick="wheelSpin()">转动<br>探索</button></div><p class="wheelresult" id="wheelResult" aria-live="polite">今日重点：'+wheelItems[focus]+'</p><button onclick="wheelGo('+focus+')">查看今日重点</button> <button id="wheelOpen" hidden>打开抽中主题</button><p><small>'+(n.length?'今日重点由流日十神主题映射到功能入口；不是吉凶预测。':'保存出生档案后显示个人主题。')+' 随机抽取仅选择阅读主题，不改变命盘或喜忌。</small></p>')}

function render(){document.getElementById('nav').innerHTML=['今日','命盘','人格','趋势','生活','发展','查询'].map((x,i)=>'<button onclick="tab='+i+';render()">'+x+'</button>').join('');let a=analysis(date),c=colors[a.target],n=natal();let out='';if(!profile.birth)out+=setup();if(tab===0){out+=wheelHome(n)+card('个人喜忌核验状态','<p>尚未核定喜用神。当前不将任何颜色判为个人必选或忌用；下方搭配仅是普通审美示例，不代表补运。</p>');if(n.length)out+=readableDay(n)+choiceGuide(n)+dailyExtra(n);out+=card(date+' · '+a.p+'日','<input type="date" value="'+date+'" onchange="date=this.value;render()"><button onclick="date=local();render()">今天</button><p>日干属'+a.f+'，与日主'+a.e+'的关系：'+rel(a.e,a.f)+'</p>');out+=card('今日象征参考','<h1>'+c[0]+'</h1><div class="row">'+c.slice(1).map(x=>'<span class="pill">'+x+'</span>').join('')+'</div><details><summary>推荐依据</summary>示范规则：选择日主所生元素；若当日天干已是该元素，则选择日主所克元素。此为简化规则，不是完整喜用神推算。</details>');out+=card('命局关系 · 大白话',a.r.length?a.r.map(x=>'<details open><summary>'+x+'</summary><p>'+(x.includes('相害')?'这里的害不是有人要害你，而是传统地支配对中的一种关系，象征配合不顺或隐性摩擦。现实参考：沟通时确认细节、价格和交付时间，不必因此取消正常安排。':x.includes('相冲')?'冲代表两个地支相对，传统上联想到变化与不同意见。现实参考：给行程和任务留出余量，不代表一定出事。':'六合是传统上的配对关系，可作为协调与合作的象征，但不保证合作成功。')+'</p></details>').join(''):'没有发现本规则覆盖的冲合害，不代表当天必然顺利。');out+=card('十二时辰',Array.from(Z,(z,i)=>{let h=G[mod(G.indexOf(a.p[0])*2+i,10)],k=rel(a.e,B[i]),time=i===0?'23:00–01:00':String(i*2-1).padStart(2,'0')+':00–'+String(i*2+1).padStart(2,'0')+':00',m={'同类':['自主与协作','整理个人任务、明确分工'],'我生':['表达与产出','写作、制作作品或整理思路'],'我克':['资源与成果','核对订单、预算或交付'],'克我':['规则与责任','检查期限、合同与任务要求'],'生我':['学习与支持','阅读资料、复盘或请教他人']}[k];return '<details open><summary>'+z+'时 '+time+' · '+m[0]+'</summary><p>大白话：'+a.e+'日主与'+B[i]+'时支形成'+k+'关系，传统象征为'+m[0]+'。清醒时可参考：'+m[1]+'。夜间正常睡眠优先。</p><small>专业依据：'+h+z+'，时干关系 '+rel(a.e,el(h))+'，时支关系 '+k+'。不是吉凶评分。</small></details>'}).join(''));}if(tab===1&&n.length){out+=readableStrength(n)+strengthCard(n)+life(n);out+=card('如何看懂自己的命盘','<p>日主是日柱天干，在传统八字里作为分析其他元素的参照，不是性格测验。</p><p>藏干是地支内部的传统元素构成；月令反映出生季节。五行数量不等于力量，不能只看缺什么就补什么。</p><p>喜用神必须结合季节、根气、生克及格局核验，当前版本暂不下结论。</p>');out+=card('四柱参考',n.map((p,i)=>'<p>'+['年柱','月柱','日柱','时柱'][i]+' <b>'+p+'</b> · '+el(p[0])+el(p[1])+' · 藏干 '+hidden[Z.indexOf(p[1])]+'</p>').join('')+'<small>年月柱使用近似节气边界，未核验真太阳时；不据此确定喜用神和大运。</small>');out+=card('五行表层分布',els.map(e=>{let count=n.join('').split('').filter(x=>el(x)===e).length;return '<p><b>'+e+' '+count+' / 8</b> <progress max="8" value="'+count+'"></progress><br>与日主的关系：'+rel(el(n[2][0]),e)+'；这是八个字中表面归类的数量，不是实际力量。</p>'}).join('')+'<p>数量最多不一定最旺，最少也不一定需要补。出生季节、藏干和根气都影响传统旺衰判断。</p>');out+=setup()}if(tab===3)out+=card('未来流日','<select onchange="window.span=+this.value;render()"><option>7</option><option '+(window.span===30?'selected':'')+'>30</option></select> 天'+Array.from({length:window.span||7},(_,i)=>{let d=new Date((daynum(date)+i)*86400000).toISOString().slice(0,10),a=analysis(d);return '<details><summary>'+d+' · '+a.p+' · '+(n.length?actionMap[ten(n[2][0],a.p[0])][0]:'待建立档案')+'</summary>'+trendExplain(d,n)+'</details>'}).join(''));if(tab===3&&n.length)out+=years(n);if(tab===2&&n.length)out+=readablePerson(n)+personality(n)+mbtiReport();if(tab===5&&n.length)out+=practical(n)+card('成长规划','<p>本周：完成一个可验证成果。</p><p>三个月：记录项目收入、成本、耗时和客户反馈。</p><p>三年：根据真实业绩与技能积累调整职业方向。</p>');if(tab===4&&n.length)out+=readableLife(n)+practical(n);if(tab===4)out+=card('生活百科',Object.entries(topics).map(([k,v])=>'<details><summary>'+k+'</summary>'+v+'</details>').join(''));if(tab===6)out+=card('五行查询','<input id="q" placeholder="例如：黄金、绿色、职业"><button onclick="query()">查询</button><p id="answer"></p>');app.innerHTML=out+'<small>传统民俗参考，不预测现实结果。当前版本仅实现简化干支及关系规则，精确排盘依赖历法库成功加载；大运和喜用神尚未完成核验。</small>';let m=document.getElementById('mbti'),j=document.getElementById('journal');if(m)m.value=localStorage.getItem('mh-mbti')||'';if(j)j.value=localStorage.getItem('mh-journal-'+date)||'';if(profile.lunar&&document.getElementById('by'))profile.lunar.split('-').forEach((v,i)=>document.getElementById(['by','bm','bd'][i]).value=v)}
function query(){let q=document.getElementById('q').value;let rules=[[/黄金|金属|银|白色/,'金'],[/木|绿|植物|园艺/,'木'],[/红|橙|灯|摄影/,'火'],[/黄|陶瓷|棕/,'土'],[/蓝|黑|水/,'水']];let r=rules.find(x=>x[0].test(q));document.getElementById('answer').textContent=r?q+'：常见象征归类为'+r[1]+'。与日主关系：'+rel(analysis(date).e,r[1])+'。不代表实际吉凶。':topics[q]||'词库尚未收录，不能可靠分类。'}render();
</script></html>
