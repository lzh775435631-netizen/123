<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木火 · 人生指南</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#173c32;font:16px/1.7 system-ui}header,nav{background:#173c32;color:white;padding:18px}main{max-width:780px;margin:auto;padding:16px 16px 100px}section{background:white;border-radius:16px;padding:20px;margin:14px 0}h1,h2,h3{margin:0 0 12px}nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:center;gap:8px}button,input,select{font:inherit;padding:10px;border:1px solid #b9c8bc;border-radius:8px}button{background:#e8eee6;color:#173c32;cursor:pointer}nav button{flex:1;max-width:150px}small{color:#69756e}details{border-top:1px solid #ddd;padding:10px 0}.pill{display:inline-block;padding:8px 15px;border-radius:12px;background:#eee;margin:4px}.row{display:flex;flex-wrap:wrap;gap:10px}</style><header><small style="color:#bdcfc4">个人传统文化参考</small><h1>木火 · 人生指南</h1></header><main id="app"><section>请选择出生日期建立个人档案。<input type="date" id="birth"><button onclick="save()">保存</button></section></main><nav id="nav"></nav><script>
const G='甲乙丙丁戊己庚辛壬癸',Z='子丑寅卯辰巳午未申酉戌亥',E='木木火火土土金金水水',B='水土木木土火火土金金土水',els=['木','火','土','金','水'],hidden=['癸','己癸辛','甲丙戊','乙','戊乙癸','丙戊庚','丁己','己丁乙','庚壬戊','辛','戊辛丁','壬甲'],mod=(n,m)=>(n%m+m)%m,daynum=d=>Math.floor(Date.parse(d+'T00:00:00Z')/86400000),pillar=n=>G[mod(n,10)]+Z[mod(n,12)],dp=d=>pillar(daynum(d)+17),local=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date()),app=document.getElementById('app');let date=local(),tab=0,profile={};try{profile=JSON.parse(localStorage.getItem('mh-profile')||'{}')}catch(e){}
const colors={木:['森林绿','青色','东','3、8','木质配饰'],火:['朱砂红','暖橙','南','2、7','暖色配饰'],土:['米黄','棕色','中央','5、10','陶瓷'],金:['白色','银色','西','4、9','金属配饰'],水:['深蓝','黑色','北','1、6','蓝色配饰']};
function save(){let parts=['by','bm','bd'].map(id=>Number(document.getElementById(id).value));if(parts[0]<1900||parts[0]>2100||parts[1]<1||parts[1]>12||parts[2]<1||parts[2]>30){alert('请输入有效农历年月日');return}let b={value:parts.join('-')}, found=parts.join('-')==='1996-7-20'?'1996-09-02':'';let fmt=new Intl.DateTimeFormat('en-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});for(let t=Date.UTC(parts[0],0,1);!found&&t<Date.UTC(parts[0]+1,2,1);t+=86400000){let p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));if(+p.relatedYear===parts[0]&&/^\d+$/.test(p.month)&&+p.month===parts[1]&&+p.day===parts[2]){found=new Date(t).toISOString().slice(0,10);break}}if(!found){alert('农历日期无效');return}profile={birth:found,lunar:b.value,hour:+document.getElementById('hour').value};try{localStorage.setItem('mh-profile',JSON.stringify(profile))}catch(e){}render()}
function setup(){return '<section><h2>个人档案</h2>请输入农历出生日期（普通月，非闰月；不上传）<br><div class="row"><label>农历年 <input id="by" type="number" inputmode="numeric" placeholder="年" min="1900" max="2100" style="width:110px"></label><label>月 <input id="bm" type="number" inputmode="numeric" placeholder="月" min="1" max="12" style="width:75px"></label><label>日 <input id="bd" type="number" inputmode="numeric" placeholder="日" min="1" max="30" style="width:75px"></label></div><select id="hour">'+Array.from(Z,(z,i)=>'<option value="'+i+'" '+(i===(profile.hour??7)?'selected':'')+'>'+z+'时</option>').join('')+'</select><button onclick="save()">保存档案</button></section>'}
function natal(){if(!profile.birth)return [];let [y,m,d]=profile.birth.split('-').map(Number);let yy=y-(m<2||m===2&&d<4?1:0),ys=mod(yy-4,10),ms=mod(m-2-(d<6?1:0),12),p=dp(profile.birth),hs=mod(G.indexOf(p[0])*2+profile.hour,10);return [pillar(yy-4),G[mod(ys*2+2+ms,10)]+Z[mod(ms+2,12)],p,G[hs]+Z[profile.hour]]}
function el(c){return G.includes(c)?E[G.indexOf(c)]:B[Z.indexOf(c)]}
function rel(a,b){let x=els.indexOf(a),y=els.indexOf(b);return ['同类','我生','我克','克我','生我'][mod(y-x,5)]}
function analysis(d){let p=dp(d),n=natal(),r=[];if(n.length){for(let i=0;i<4;i++){let a=Z.indexOf(p[1]),b=Z.indexOf(n[i][1]),s=mod(a-b,12);if(s===6)r.push('流日'+p[1]+'与'+['年','月','日','时'][i]+'支'+n[i][1]+'相冲');if(mod(a+b,12)===1)r.push('流日与'+n[i][1]+'六合');if(mod(a+b,12)===7)r.push('流日与'+n[i][1]+'相害')}}let e=n.length?el(n[2][0]):'水',f=el(p[0]),target=els[mod(els.indexOf(e)+1,5)];if(f===target)target=els[mod(els.indexOf(e)+2,5)];return {p,r,e,f,target}}
function card(title,body){return '<section><h2>'+title+'</h2>'+body+'</section>'}
const topics={'穿搭':'颜色属于传统象征，按肤色与场合搭配。','首饰':'木质属木、金属属金；宝石归类因流派而异。','城市':'方位取决于出发地，气候不等于命理属性；就业与成本优先。','职业':'教育常归木，传播常归火，金融常归金；实际技能和收入更重要。','家居':'植物取木、照明取火，注意通风采光和消防。','饮食':'五色食物是传统文化分类，不应因此限制饮水或营养。','兴趣':'阅读、园艺常取木象，摄影、舞蹈常取火象。','日用品':'按颜色和材质分别归类，不必更换正常用品。'};
function plain(a){let k=rel(a.e,a.f),map={'同类':['同类力量','传统上象征自主、伙伴与竞争。','把合作分工和自己的目标写清楚，避免重复投入。'],'我生':['输出力量','传统上象征表达、技能、作品与创造。','选一个可以完成的作品或任务，先交付再优化。'],'我克':['财星关系','传统上象征资源、交易与成果，不等于今天一定赚钱。','核算成本、检查订单和现金流，不凭命理下注。'],'克我':['官杀关系','传统上象征责任、规则和外部要求，不意味着必有压力。','先处理截止日期、合同和重要承诺。'],'生我':['印星关系','传统上象征学习、知识和支持。','复盘已有经验，找可靠资料解决一个实际问题。']};return map[k]}
function deep(a){let t=plain(a),c=colors[a.target],n=natal();return card('今日报告 · 大白话','<h3>'+t[0]+'</h3><p>'+t[1]+'</p><p><b>今天怎么做：</b>'+t[2]+'</p><details><summary>为什么这样解释？</summary>日主'+a.e+'，流日'+a.p+'，日干'+a.f+'，五行关系为'+rel(a.e,a.f)+'。这是传统十神的五行层级解释，未区分阴阳正偏，也不等于旺衰判断。</details>')+card('穿搭与生活应用','<p>主色：'+c[0]+'；点缀：'+c[1]+'。可以选择一件主色上衣，配中性色裤子与鞋，或只在配饰中使用。</p><p>方位 '+c[2]+'、数字 '+c[3]+'、物品 '+c[4]+' 都是传统象征，不需要改变正常出行或购买用品。</p><details><summary>依据与局限</summary>当前采用日主所生、所克元素的简化主题规则，尚未核定个人喜用神，因此不能解释为真正的幸运预测。</details>')+card('事业 · 财富 · 人际','<p><b>事业：</b>'+t[2]+'</p><p><b>财富：</b>区分收入、成本和可用余额；不要用流日决定投资或借贷。</p><p><b>人际：</b>明确自己的需求和承诺，遇到分歧先核实现实原因。</p>')+card('命局互动 · 看懂术语',a.r.length?a.r.map(x=>'<p>'+x+'<br><small>'+ (x.includes('相冲')?'冲是地支相对的传统关系，常被解释为变化或矛盾，不代表必然发生事故。':x.includes('六合')?'六合是传统配对关系，常被解释为连接或协调，不代表一定有好事。':'害是传统地支关系的一种，象征潜在摩擦，不代表现实中有人害你。')+'</small></p>').join(''):'本规则未发现已覆盖的冲合害；这不代表当天一定平顺。')+card('与昨天、明天对比',[-1,0,1].map(i=>{let d=new Date((daynum(date)+i)*86400000).toISOString().slice(0,10),v=analysis(d);return '<p>'+['昨天','今天','明天'][i+1]+' '+v.p+' · '+plain(v)[0]+'<br><small>'+plain(v)[1]+'</small></p>'}).join(''))}
function render(){document.getElementById('nav').innerHTML=['今日','命盘','趋势','生活','查询'].map((x,i)=>'<button onclick="tab='+i+';render()">'+x+'</button>').join('');let a=analysis(date),c=colors[a.target],n=natal();let out='';if(!profile.birth)out+=setup();if(tab===0){if(n.length)out+=deep(a);out+=card(date+' · '+a.p+'日','<input type="date" value="'+date+'" onchange="date=this.value;render()"><button onclick="date=local();render()">今天</button><p>日干属'+a.f+'，与日主'+a.e+'的关系：'+rel(a.e,a.f)+'</p>');out+=card('今日象征参考','<h1>'+c[0]+'</h1><div class="row">'+c.slice(1).map(x=>'<span class="pill">'+x+'</span>').join('')+'</div><details><summary>推荐依据</summary>示范规则：选择日主所生元素；若当日天干已是该元素，则选择日主所克元素。此为简化规则，不是完整喜用神推算。</details>');out+=card('命局关系',a.r.join('<br>')||'未检测到本规则覆盖的冲、合、害。');out+=card('十二时辰',Array.from(Z,(z,i)=>'<div>'+z+'时 · '+G[mod(G.indexOf(a.p[0])*2+i,10)]+z+' · '+rel(a.e,B[i])+'</div>').join(''));}if(tab===1&&n.length){out+=card('如何看懂自己的命盘','<p>日主是日柱天干，在传统八字里作为分析其他元素的参照，不是性格测验。</p><p>藏干是地支内部的传统元素构成；月令反映出生季节。五行数量不等于力量，不能只看缺什么就补什么。</p><p>喜用神必须结合季节、根气、生克及格局核验，当前版本暂不下结论。</p>');out+=card('四柱参考',n.map((p,i)=>'<p>'+['年柱','月柱','日柱','时柱'][i]+' <b>'+p+'</b> · '+el(p[0])+el(p[1])+' · 藏干 '+hidden[Z.indexOf(p[1])]+'</p>').join('')+'<small>年月柱使用近似节气边界，未核验真太阳时；不据此确定喜用神和大运。</small>');out+=card('五行表层分布',els.map(e=>'<p>'+e+' '+n.join('').split('').filter(x=>el(x)===e).length+' / 8</p>').join(''));out+=setup()}if(tab===2)out+=card('未来流日','<select onchange="window.span=+this.value;render()"><option>7</option><option '+(window.span===30?'selected':'')+'>30</option></select> 天'+Array.from({length:window.span||7},(_,i)=>{let d=new Date((daynum(date)+i)*86400000).toISOString().slice(0,10),a=analysis(d);return '<details><summary>'+d+' · '+a.p+' · '+colors[a.target][0]+'</summary>'+(a.r.join('<br>')||'无已覆盖关系')+'</details>'}).join(''));if(tab===3)out+=card('生活百科',Object.entries(topics).map(([k,v])=>'<details><summary>'+k+'</summary>'+v+'</details>').join(''));if(tab===4)out+=card('五行查询','<input id="q" placeholder="例如：黄金、绿色、职业"><button onclick="query()">查询</button><p id="answer"></p>');app.innerHTML=out+'<small>传统民俗参考，不预测现实结果。当前版本仅实现简化干支及关系规则，未实现精确节气、大运和喜用神。</small>'}
function query(){let q=document.getElementById('q').value;let rules=[[/黄金|金属|银|白色/,'金'],[/木|绿|植物|园艺/,'木'],[/红|橙|灯|摄影/,'火'],[/黄|陶瓷|棕/,'土'],[/蓝|黑|水/,'水']];let r=rules.find(x=>x[0].test(q));document.getElementById('answer').textContent=r?q+'：常见象征归类为'+r[1]+'。与日主关系：'+rel(analysis(date).e,r[1])+'。不代表实际吉凶。':topics[q]||'词库尚未收录，不能可靠分类。'}render();
</script></html>
