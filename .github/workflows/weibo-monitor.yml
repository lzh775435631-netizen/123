name: Weibo monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: weibo-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest posts
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python weibo-monitor/monitor.py
      - name: Persist monitor results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weibo-monitor/latest.json
          test ! -f weibo-monitor/state.json || git add weibo-monitor/state.json
          test ! -f weibo-monitor/history.jsonl || git add weibo-monitor/history.jsonl
          git diff --cached --quiet || (git commit -m "Update Weibo monitoring results" && git push)

